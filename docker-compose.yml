# Deployment topology for the Acme order system.
#
# The code for these services lives in three other repositories; this repo only
# describes how they are wired together at runtime:
#
#   acme-orders-schema     -> the `migrate` job
#   acme-orders-api        -> the `orders-api` service
#   acme-orders-reporting  -> the `reporting` job
#
services:
  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme_dev
      POSTGRES_DB: acme_orders
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme_orders"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"

  migrate:
    image: acme-orders-schema:latest
    build:
      context: ../acme-orders-schema
    environment:
      DATABASE_URL: postgresql://acme:acme_dev@orders-db:5432/acme_orders
    depends_on:
      orders-db:
        condition: service_healthy
    restart: "no"

  orders-api:
    image: acme-orders-api:latest
    build:
      context: ../acme-orders-api
    environment:
      DATABASE_URL: postgresql://acme:acme_dev@orders-db:5432/acme_orders
      PORT: "4010"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4010/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  reporting:
    image: acme-orders-reporting:latest
    build:
      context: ../acme-orders-reporting
    environment:
      DATABASE_URL: postgresql://acme:acme_dev@orders-db:5432/acme_orders
      ORDERS_API_URL: http://orders-api:4010
    depends_on:
      orders-api:
        condition: service_healthy
    restart: "no"

volumes:
  orders-data:
